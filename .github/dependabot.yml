version: 2
updates:
  # npm / yarn パッケージの監視設定
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '21:00'
      timezone: 'Asia/Tokyo'

    # 関連するライブラリ更新を1つのPRにまとめる設定
    groups:
      react-next:
        patterns:
          - 'react*'
          - 'next'
          - '@next/*'
          - '@types/react*'
      storybook:
        patterns:
          - 'storybook'
          - '@storybook/*'
          - '@chromatic-com/*'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'playwright'
      code-quality:
        patterns:
          - 'eslint*'
          - 'prettier*'
          - 'husky'
          - 'lint-staged'
          - 'typescript'

    commit-message:
      prefix: 'chore(deps)'

  # GitHub Actions を利用している場合の監視設定
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '21:00'
      timezone: 'Asia/Tokyo'
    commit-message:
      prefix: 'ci'
